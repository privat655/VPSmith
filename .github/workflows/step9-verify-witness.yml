name: Step 9 verify witness

on:
  workflow_run:
    workflows:
      - verify
    types:
      - completed

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  witness:
    if: github.event.workflow_run.head_branch == 'agent/step9-core-lifecycle'
    runs-on: ubuntu-24.04
    steps:
      - name: Record canonical verify result on PR 16
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          conclusion = os.environ['CONCLUSION']
          head = os.environ['HEAD_SHA']
          run_id = os.environ['RUN_ID']
          body = (
              f"Step 9 automated verification witness: canonical `verify` run "
              f"`{run_id}` for head `{head}` concluded **{conclusion}**. "
              "The fresh Step-7-prepared VPS acceptance remains a separate mandatory gate."
          )
          repo = os.environ['REPO']
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/16/comments",
              data=json.dumps({"body": body}).encode(),
              method="POST",
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f"comment failed: HTTP {response.status}")
          PY

      - uses: actions/checkout@v4
        with:
          ref: agent/step9-core-lifecycle
          fetch-depth: 0

      - name: Remove one-shot witness
        run: |
          git rm .github/workflows/step9-verify-witness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(step9): remove verification witness"
          git push origin HEAD:agent/step9-core-lifecycle
