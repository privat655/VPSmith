name: Step 9 finalize

on:
  push:
    branches:
      - agent/step9-core-lifecycle
    paths:
      - .github/workflows/step9-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/step9-core-lifecycle

      - name: Materialize reviewed Step 9 tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TREE_SHA: 65eab5886d919fa4ba4be43ef18fd8a8cc50b5e2
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import pathlib
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          tree_sha = os.environ["TREE_SHA"]
          wanted = [
              "embedded/core/actions/restore.sh",
              "internal/corelifecycle/core_backup_contract.go",
              "internal/corelifecycle/core_backup_test.go",
              "internal/corelifecycle/core_desired_contract.go",
              "internal/corelifecycle/core_disk_preflight.go",
              "internal/corelifecycle/core_disk_preflight_test.go",
              "internal/corelifecycle/core_update.go",
              "internal/corelifecycle/lifecycle.go",
              "internal/corelifecycle/module_compatibility.go",
              "internal/corelifecycle/poststate_test.go",
              "internal/deployment/core.go",
              "internal/deployment/core_compatibility.go",
              "internal/deployment/core_image_locking.go",
              "internal/deployment/core_platform.go",
              "internal/deployment/core_platform_test.go",
              "internal/deployment/core_runtime.go",
              "internal/deployment/core_runtime_test.go",
              "internal/deployment/generator_edge.go",
              "internal/managementstate/observed_facts.go",
              "internal/managementstate/types.go",
              "internal/sourcelibrary/core_candidate.go",
              "internal/sourcelibrary/core_candidate_test.go",
              "internal/targetgateway/inspector.go",
              "internal/targetgateway/step9_runtime_observation_test.go",
          ]

          def api(path):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          tree = api(f"/git/trees/{tree_sha}?recursive=1")
          entries = {entry["path"]: entry for entry in tree["tree"]}
          missing = [path for path in wanted if path not in entries or entries[path]["type"] != "blob"]
          if missing:
              raise SystemExit(f"reviewed tree is missing files: {missing}")

          for path in wanted:
              entry = entries[path]
              blob = api(f"/git/blobs/{entry['sha']}")
              if blob.get("encoding") != "base64":
                  raise SystemExit(f"unexpected blob encoding for {path}")
              data = base64.b64decode(blob["content"])
              target = pathlib.Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              target.chmod(0o644)
          PY

      - name: Format and verify source contracts
        run: |
          gofmt -w \
            internal/corelifecycle \
            internal/deployment \
            internal/managementstate \
            internal/sourcelibrary \
            internal/targetgateway
          bash -n embedded/core/actions/restore.sh
          git diff --check
          make verify-go

      - name: Commit verified Step 9 implementation
        run: |
          git rm .github/workflows/step9-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            embedded/core/actions/restore.sh \
            internal/corelifecycle \
            internal/deployment \
            internal/managementstate \
            internal/sourcelibrary \
            internal/targetgateway
          git diff --cached --check
          git commit -m "feat(step9): close Core lifecycle contracts"
          git push origin HEAD:agent/step9-core-lifecycle
