name: step9-normalize
on:
  push:
    branches: [agent/step9-core-lifecycle]
    paths: [.github/workflows/step9-normalize.yml]
permissions:
  contents: write
jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/step9-core-lifecycle
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version: '1.26.5'
      - name: Normalize recovered Step 9 sources
        run: |
          gofmt -w internal/corelifecycle/core_backup_contract.go internal/corelifecycle/lifecycle.go internal/deployment/core_runtime_test.go
          go run ./build/cmd/embedded-manifest -root embedded -manifest embedded/manifest.json
          rm .github/workflows/step9-normalize.yml
          git diff --check
          git status --short
      - name: Commit normalized product sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/corelifecycle/core_backup_contract.go internal/corelifecycle/lifecycle.go internal/deployment/core_runtime_test.go embedded/manifest.json .github/workflows/step9-normalize.yml
          git commit -m 'chore(step9): normalize Core lifecycle sources'
          git push origin HEAD:agent/step9-core-lifecycle
