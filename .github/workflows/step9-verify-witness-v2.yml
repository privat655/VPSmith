name: Step 9 verify witness v2

on:
  push:
    branches:
      - agent/step9-core-lifecycle
    paths:
      - .github/workflows/step9-verify-witness-v2.yml

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  witness:
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for canonical verify of this exact head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request

          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          head = os.environ['HEAD_SHA']
          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(url):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          run = None
          for _ in range(90):
              query = urllib.parse.urlencode({'head_sha': head, 'event': 'pull_request', 'per_page': 20})
              data = get(f'https://api.github.com/repos/{repo}/actions/workflows/verify.yml/runs?{query}')
              matches = [item for item in data.get('workflow_runs', []) if item.get('head_sha') == head]
              if matches:
                  candidate = max(matches, key=lambda item: item['id'])
                  if candidate.get('status') == 'completed':
                      run = candidate
                      break
              time.sleep(5)
          if run is None:
              raise SystemExit('canonical verify did not complete for the exact witness head')

          conclusion = run.get('conclusion') or 'unknown'
          body = (
              f"Step 9 automated verification witness: canonical `verify` run "
              f"`{run['id']}` for exact head `{head}` concluded **{conclusion}**. "
              "The fresh Step-7-prepared VPS acceptance remains a separate mandatory gate."
          )
          request = urllib.request.Request(
              f'https://api.github.com/repos/{repo}/issues/16/comments',
              data=json.dumps({'body': body}).encode(),
              method='POST',
              headers={**headers, 'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(request) as response:
              if response.status != 201:
                  raise SystemExit(f'comment failed: HTTP {response.status}')
          if conclusion != 'success':
              raise SystemExit(f'canonical verify conclusion: {conclusion}')
          PY

      - uses: actions/checkout@v4
        with:
          ref: agent/step9-core-lifecycle
          fetch-depth: 0

      - name: Remove one-shot witnesses after green verify
        run: |
          git rm -f \
            .github/workflows/step9-verify-witness.yml \
            .github/workflows/step9-verify-witness-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(step9): remove verification witnesses"
          git push origin HEAD:agent/step9-core-lifecycle
