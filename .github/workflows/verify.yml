name: verify

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  one-time-secret-metadata-hardening:
    if: github.ref == 'refs/heads/agent/step-2-management-state'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Reject secret plaintext already present in secret metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/managementstate/store.go')
          text = p.read_text()
          needle = 'for _, query := range []string{\n\t\t`SELECT version||sha256||base_source_id FROM core_sources`,'
          replacement = 'for _, query := range []string{\n\t\t`SELECT name FROM secrets`,\n\t\t`SELECT version||sha256||base_source_id FROM core_sources`,'
          if needle not in text:
              raise SystemExit('expected store.go insertion point not found')
          p.write_text(text.replace(needle, replacement, 1))
          PY
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651 \
            sh -eu -c 'gofmt -w internal/managementstate/store.go'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add internal/managementstate/store.go
          git commit -m 'Reject secret plaintext in secret metadata'
          git push origin HEAD:agent/step-2-management-state

  go:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify Go code with pinned toolchain image
        run: |
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651 \
            sh -eu -c 'go version && make verify-go'

  containers:
    name: containers (Linux/amd64 reference)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify shell scripts parse
        run: sh -n build/*.sh
      - name: Verify Docker runtime contract
        run: ./build/verify-container.sh docker
      - name: Verify Docker reproducibility
        run: ./build/verify-reproducible-image.sh docker
      - name: Verify Podman is available
        run: podman --version
      - name: Verify Podman runtime contract
        run: ./build/verify-container.sh podman
      - name: Verify Podman reproducibility
        run: ./build/verify-reproducible-image.sh podman
