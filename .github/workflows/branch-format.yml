name: branch-format

on:
  push:
    branches:
      - agent/fix-step7-architecture-audit
    paths:
      - '**/*.go'
      - '.github/workflows/branch-format.yml'

permissions:
  contents: write

jobs:
  gofmt:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Normalize branch Go sources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/managementstate/store_test.go')
          s = p.read_text()
          if 'NewCoreSourceID' in s:
              start = s.index('func TestSourceSyncAndStudioBasisChangesNeverChangeTargetState')
              end = s.index('\nfunc TestStateFilesUseRestrictivePermissionsAndMissingKeyFailsClosed', start)
              replacement = r'''func TestSourceSyncAndStudioBasisChangesNeverChangeTargetState(t *testing.T) {
            store := mustMemory(t)
            ctx := context.Background()
            targetID := mustID(t, managementstate.NewTargetID)
            oldCore := mustID(t, managementstate.NewSourceSnapshotID)
            newCore := mustID(t, managementstate.NewSourceSnapshotID)
            installedPackageID := mustID(t, managementstate.NewModulePackageID)
            remotePackageID := mustID(t, managementstate.NewModulePackageID)
            installedModule := mustID(t, managementstate.NewSourceSnapshotID)
            remoteModule := mustID(t, managementstate.NewSourceSnapshotID)
            if err := store.Change(ctx, func(change *managementstate.Change) error {
              if err := change.CreateTarget(managementstate.TargetRegistration{ID: targetID, Address: "203.0.113.15", SSHUser: "dev"}); err != nil { return err }
              if err := change.RegisterSourceArtifact(managementstate.SourceArtifact{ID: oldCore, Kind: managementstate.SourceCore, Version: "old", SHA256: strings.Repeat("a", 64), StorageRef: "snapshots/sha256/core-old"}); err != nil { return err }
              return change.RegisterSourceArtifact(managementstate.SourceArtifact{ID: installedModule, Kind: managementstate.SourceCustomModule, PackageID: installedPackageID, PackagePath: "modules/installed", Version: "1", Commit: "installed", SHA256: strings.Repeat("b", 64), StorageRef: "snapshots/sha256/module-installed"})
            }); err != nil { t.Fatal(err) }
            before, err := store.Snapshot(ctx)
            if err != nil { t.Fatal(err) }
            if err := store.Change(ctx, func(change *managementstate.Change) error {
              if err := change.RegisterSourceArtifact(managementstate.SourceArtifact{ID: newCore, Kind: managementstate.SourceCore, Version: "new", SHA256: strings.Repeat("c", 64), StorageRef: "snapshots/sha256/core-new"}); err != nil { return err }
              return change.RegisterSourceArtifact(managementstate.SourceArtifact{ID: remoteModule, Kind: managementstate.SourceCustomModule, PackageID: remotePackageID, PackagePath: "modules/remote", Version: "2", Commit: "remote-new", SHA256: strings.Repeat("d", 64), StorageRef: "snapshots/sha256/module-remote"})
            }); err != nil { t.Fatal(err) }
            after, err := store.Snapshot(ctx)
            if err != nil { t.Fatal(err) }
            if !reflect.DeepEqual(before.Targets, after.Targets) { t.Fatal("source synchronization changed target state") }
            if len(before.Sources.Artifacts) != 2 || len(after.Sources.Artifacts) != 4 { t.Fatalf("canonical source snapshot history before=%d after=%d", len(before.Sources.Artifacts), len(after.Sources.Artifacts)) }
            if after.Sources.Artifacts[0].ID == "" { t.Fatal("canonical source identities were not retained") }
          }
          '''
              p.write_text(s[:start] + replacement + s[end:])
          PY
          gofmt -w $(find . -name '*.go' -type f -print)
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.go'
          git commit -m 'chore: normalize remaining source tests'
          git push origin HEAD:agent/fix-step7-architecture-audit
